<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spanish Flashcards — Typing mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">SF</div>
          <div class="brand-text">
            <h1>Typing mode</h1>
            <p class="subtitle">Type the translation. Close answers can be accepted.</p>
          </div>
        </div>
        <nav class="top-nav" aria-label="Primary">
        <a class="nav-link" href="../index.html">Home</a>
        <a class="nav-link" href="../flashcards.html">Flashcards</a>
        <a class="nav-link is-active" href="./typing.html">Typing</a>
        <a class="nav-link" href="./match-columns.html">Match</a>
        <a class="nav-link" href="./pairs.html">Pairs</a>
        <a class="nav-link" href="./mcq.html">MCQ</a>
</nav>
      </div>
    </header>

    <main class="container">
      <section class="card app-surface">
        <p class="muted">Type the answer, then press <span class="kbd">Enter</span>. Use “Reveal” if you get stuck.</p>

    <div class="panel">
      <div class="row">
        <label for="deck-select">Deck</label>
        <select id="deck-select">
          <option value="all">All cards (mixed)</option>
        </select>

        <label for="direction">Direction</label>
        <select id="direction">
          <option value="es2en">Spanish → English</option>
          <option value="en2es">English → Spanish</option>
        </select>

        <label for="strict">Accents</label>
        <select id="strict">
          <option value="lenient">Lenient (ignore accents)</option>
          <option value="strict">Strict (must match accents)</option>
        </select>
      </div>

      <div id="prompt" class="prompt">—</div>
      <div id="subprompt" class="subprompt muted"></div>

      <div class="row">
        <input id="answer" type="text" placeholder="Type your answer…" autocomplete="off" spellcheck="false" />
        <button id="check" class="btn primary">Check</button>
        <button id="reveal" class="btn">Reveal</button>
        <button id="skip" class="btn">Skip</button>
        <button id="next" class="btn">Next</button>
      </div>

      <div id="feedback" class="feedback"></div>
      <div id="answerBox" class="answer"></div>

      <div class="stats">
        <div>✅ <span id="correct">0</span></div>
        <div>❌ <span id="wrong">0</span></div>
        <div>🔥 Streak: <span id="streak">0</span></div>
        <div class="muted">Cards: <span id="count">0</span></div>
      </div>

      <div class="actions" style="justify-content:flex-start; margin-top: 10px;">
</div>
    </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>Spanish Flashcards</span>
        <span class="muted">Press Enter to check your answer.</span>
      </div>
    </footer>
  </div>
<script src="../decks-data.js"></script>
  <script src="./typing.js"></script>
</body>
</html>
