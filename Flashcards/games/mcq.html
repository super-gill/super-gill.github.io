<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spanish Flashcards — Multiple choice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">SF</div>
          <div class="brand-text">
            <h1>Multiple choice</h1>
            <p class="subtitle">Pick the correct translation from four options.</p>
          </div>
        </div>
        <nav class="top-nav" aria-label="Primary">
        <a class="nav-link" href="../index.html">Home</a>
        <a class="nav-link" href="../flashcards.html">Flashcards</a>
        <a class="nav-link" href="./typing.html">Typing</a>
        <a class="nav-link" href="./match-columns.html">Match</a>
        <a class="nav-link" href="./pairs.html">Pairs</a>
        <a class="nav-link is-active" href="./mcq.html">MCQ</a>
</nav>
      </div>
    </header>

    <main class="container">
      <section class="card app-surface">
        <div class="deck-select">
      <label for="deck-select">Deck:</label>
      <select id="deck-select">
        <option value="all">All cards (mixed)</option>
      </select>
    </div>

    <div class="controls">
      <label>
        Direction:
        <select id="direction">
          <option value="es_to_en" selected>Spanish → English</option>
          <option value="en_to_es">English → Spanish</option>
        </select>
      </label>
      <button id="next" class="btn" style="margin-left:.5rem;">Next</button>
    </div>

    <div class="game-panel">
      <div style="font-size:1.25rem; font-weight:700;" id="prompt"></div>
      <div style="margin-top:.2rem; color:#555;" id="sub"></div>

      <div class="mcq-options" id="options"></div>

      <div class="status-line">
        <div>Correct: <strong id="correct">0</strong></div>
        <div>Wrong: <strong id="wrong">0</strong></div>
        <div>Streak: <strong id="streak">0</strong></div>
      </div>

      <div class="actions" style="justify-content:flex-start; margin-top: 10px;">
</div>
      <p id="hint" style="margin:.75rem 0 0; color:#555;"></p>
    </div>
  </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>Spanish Flashcards</span>
        <span class="muted">Progress saved in your browser.</span>
      </div>
    </footer>
  </div>
<script src="../decks-data.js"></script>
  <script src="./mcq.js"></script>
</body>
</html>
