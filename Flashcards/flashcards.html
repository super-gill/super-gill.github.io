      setTimeout(() => {
        if (messageEl.textContent === text) {
          messageEl.textContent = "";
        }
      }, timeout);
    }
  }

  function getCurrentMode() {
    const checked = document.querySelector('input[name="direction-mode"]:checked');
    return checked ? checked.value : "es-en";
  }

  function loadCard() {
    if (!currentDeckCards.length) {
      questionEl.textContent = "No cards in this deck.";
      answerEl.textContent = "";
      directionHintEl.textContent = "";
      showAnswerBtn.disabled = true;
      correctBtn.disabled = true;
      incorrectBtn.disabled = true;
      messageEl.textContent = "";
      isShowingAnswer = false;
      cardEl.classList.remove("flipped");
      return;
    }

    const card = currentDeckCards[currentIndex];
    const mode = getCurrentMode();

    let showSpanishOnFront;

    if (mode === "es-en") {
      showSpanishOnFront = true;
    } else if (mode === "en-es") {
      showSpanishOnFront = false;
    } else {
      // "random" mode: 50/50 each card
      showSpanishOnFront = Math.random() < 0.5;
    }

    if (showSpanishOnFront) {
      currentFrontText = card.es;
      currentBackText = card.en;
      directionHintEl.textContent = "Translate into English";
    } else {
      currentFrontText = card.en;
      currentBackText = card.es;
      directionHintEl.textContent = "Translate into Spanish";
    }

    questionEl.textContent = currentFrontText;
    answerEl.textContent = "";

    isShowingAnswer = false;
    cardEl.classList.remove("flipped");
    showAnswerBtn.disabled = false;

    correctBtn.disabled = true;
    incorrectBtn.disabled = true;

    messageEl.textContent = "";
  }

  function showAnswer() {
    if (isShowingAnswer || !currentDeckCards.length) return;
    isShowingAnswer = true;

    answerEl.textContent = currentBackText;

    cardEl.classList.add("flipped");
    showAnswerBtn.disabled = true;

    correctBtn.disabled = false;
    incorrectBtn.disabled = false;
  }

  // UPDATED: respects missedQueue and review phase
  function goToNextCard() {
    if (!currentDeckCards.length) return;

    currentIndex++;

    // If we've reached the end of the current list
    if (currentIndex >= currentDeckCards.length) {
      // If we just finished the main deck and there are missed cards, review them
      if (!inMissedPhase && missedQueue.length > 0) {
        currentDeckCards = missedQueue.slice();
        missedQueue = [];
        shuffle(currentDeckCards);
        currentIndex = 0;
        inMissedPhase = true;
        showMessage("Reviewing missed cards from this deck.");
        loadCard();
        return;
      }

      // Otherwise we finished either:
      // - main deck with no misses, or
      // - the missed review phase.
      currentDeckCards = buildDeckCards(currentDeckId);
      shuffle(currentDeckCards);
      currentIndex = 0;
      inMissedPhase = false;
      showMessage("You've seen all the cards in this deck. Shuffled and starting again.");
      loadCard();
      return;
    }

    // Normal advance within current list
    loadCard();
  }

  // UPDATED: adds the card to missedQueue when incorrect
  function handleResult(isCorrect) {
    if (!isShowingAnswer || !currentDeckCards.length) return;

    const currentCard = currentDeckCards[currentIndex];

    if (isCorrect) {
      correctCount++;
    } else {
      incorrectCount++;
      missedQueue.push(currentCard);
    }
    updateScore();
    goToNextCard();
  }

  // UPDATED: change deck resets missedQueue and review phase
  function changeDeck(deckId) {
    currentDeckId = deckId;
    currentDeckCards = buildDeckCards(deckId);
    shuffle(currentDeckCards);
    currentIndex = 0;
    correctCount = 0;
    incorrectCount = 0;
    missedQueue = [];
    inMissedPhase = false;
    updateScore();
    loadCard();
    if (currentDeckCards.length) {
      showMessage(
        currentDeckCards.length +
          " card" +
          (currentDeckCards.length === 1 ? "" : "s") +
          " in this deck.",
        1500
      );
    } else {
      showMessage("This deck is empty.", 3000);
    }
  }

  // === EVENT LISTENERS ========================================
  showAnswerBtn.addEventListener("click", showAnswer);
  correctBtn.addEventListener("click", () => handleResult(true));
  incorrectBtn.addEventListener("click", () => handleResult(false));

  document.addEventListener("keydown", (e) => {
    if (e.key === " " || e.code === "Space") {
      e.preventDefault();
      if (!isShowingAnswer) showAnswer();
    } else if (e.key === "ArrowRight") {
      handleResult(true);
    } else if (e.key === "ArrowLeft") {
      handleResult(false);
    }
  });

  modeRadios.forEach((radio) => {
    radio.addEventListener("change", () => {
      loadCard(); // reload same card with new direction/mode
    });
  });

  deckSelectEl.addEventListener("change", (e) => {
    changeDeck(e.target.value);
  });

  // === INIT ===================================================
  currentDeckCards = buildDeckCards(currentDeckId);
  shuffle(currentDeckCards);
  loadCard();
  updateScore();
  if (currentDeckCards.length) {
    showMessage(currentDeckCards.length + " cards in this deck.", 1500);
  }
</script>
