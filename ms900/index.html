<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .question-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80%;
            max-width: 600px;
            border: 1px solid #ccc;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color: #f9f9f9;
            text-align: left;
        }

        .question-container.active {
            display: flex;
        }

        .navigation {
            margin-top: 20px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
            cursor: pointer;
        }

        .check-answer {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div id="questions">
        <script>
            const questions = [
                { id: 1, text: "Your company plans to migrate from on-premises to a hybrid cloud deployment. Which of the following options meet the requirement?", options: ["Microsoft Office Delve", "Microsoft SharePoint", "Microsoft Yammer", "Microsoft Skype for Business", "Microsoft Teams"], correct: ["Microsoft SharePoint", "Microsoft Skype for Business"] },
                { id: 2, text: "All applications will remain in a hybrid environment after migrating to Microsoft Azure. Select 'No adjustment required' if the underlined segment is accurate. If the underlined segment is inaccurate, select the accurate option.", options: ["A. No adjustment required.", "B. Applications that manage sensitive information", "C. Applications where access requires a USB-token device", "D. All legacy applications"], correct: "D" },
                { id: 3, text: "Your company plans to move their Server environment to the cloud. Solution: You recommend the Platform as a service (PaaS) model. Does the solution meet the goal?", options: ["A. Yes", "B. No"], correct: "B" },

                { id: 5, text: "Your company plans to move their Server environment to the cloud. Solution: You recommend the Software as a service (SaaS) model. Does the solution meet the goal?", options: ["A. Yes", "B. No"], correct: "A" },
                { id: 6, text: "Your company makes use of Platform as a Service (PaaS) for their Azure solution. Which of the following options are components that your IT employees are responsible for?", options: ["A. Networks.", "B. Databases.", "C. Applications.", "D. Servers."], correct: "C" },
                { id: 7, text: "Your company makes use of Platform as a Service (PaaS) for their Azure solution. Which of the following options are components that Microsoft are responsible for? (Choose all that apply).", options: ["A. Storage.", "B. Databases.", "C. Applications.", "D. Operating system."], correct: ["A", "B", "D"] },

                { id: 13, text: "Your company has a Microsoft Office 365 subscription. As an administrator for this subscription, you are educating new users on which component to use for audio and visual communications with colleagues.", options: ["A. Microsoft Exchange Online", "B. Enterprise Mobility + Security", "C. Microsoft Teams", "D. Microsoft SharePoint Online"], correct: "C" },
                { id: 14, text: "Your company makes use of Microsoft 365 in their environment. You have been tasked with making sure that admin roles are protected. The feature you use should achieve this by requiring approvals.", options: ["A. Mobile application protection policy.", "B. Microsoft Azure AD Identity Protection.", "C. Microsoft Azure AD Privilege Identity Protection.", "D. Microsoft Azure AD Conditional Access."], correct: "C" },
                { id: 15, text: "Your company makes use of Microsoft 365 in their environment. You have been tasked with making sure that members of the Global Administrators group are protected. The feature you use should achieve this by making use of dynamic risk profiles.", options: ["A. Mobile application protection policy.", "B. Device configuration policy.", "C. Microsoft Azure AD Privilege Identity Protection.", "D. Microsoft Azure AD Conditional Access."], correct: "D" },

                { id: 18, text: "Your company has a Microsoft Office 365 subscription. As an administrator, you need to prohibit users from copying corporate information from managed applications installed on unmanaged devices.", options: ["A. Windows Virtual Desktop.", "B. Microsoft Intune.", "C. Windows AutoPilot.", "D. Azure AD Application Proxy."], correct: "B" },
                { id: 19, text: "Your company has a Microsoft Office 365 subscription. As an administrator for this subscription, you have been tasked with recommending a solution that forces cloud-based applications to use the same credentials as on-premises applications.", options: ["A. Azure AD Connect.", "B. Configuration Manager.", "C. Windows AutoPilot.", "D. Azure AD Application Proxy."], correct: "A" },
                { id: 20, text: "Your company has a Microsoft Office 365 subscription. As an administrator for this subscription, you have been tasked with recommending a solution that prohibits users from copying corporate information from managed applications installed on unmanaged devices.", options: ["A. Windows Virtual Desktop.", "B. Microsoft Intune.", "C. Windows AutoPilot.", "D. Azure AD Application Proxy."], correct: "B" },
                { id: 21, text: "You have recently made use of Windows Autopilot to deploy Windows 10 devices in your company's environment. You have been asked to make sure that data stored in OneDrive for Business is available to users from remote locations. Solution: You enable Microsoft Azure AD multi-factor authentication for the users. Does the solution meet the goal?", options: ["A. Yes", "B. No"], correct: "B" },
                { id: 22, text: "You have recently made use of Windows Autopilot to deploy Windows 10 devices in your company's environment. You have been asked to make sure that data stored in OneDrive for Business is available to users from remote locations. Solution: You enroll the devices in Microsoft Intune. Does the solution meet the goal?", options: ["A. Yes", "B. No"], correct: "B" },
                { id: 23, text: "You have recently made use of Windows Autopilot to deploy Windows 10 devices in your company's environment. You have been asked to make sure that data stored in OneDrive for Business is available to users from remote locations. Solution: You inform users that they should use their Microsoft Azure AD credentials to sign in to their devices. Does the solution meet the goal?", options: ["A. Yes", "B. No"], correct: "A" },
                { id: 24, text: "Your company makes use of Microsoft 365 in their environment. You have been tasked with making sure that admin roles are protected. The feature you use should achieve this by requiring approvals. Which of the following is a feature you should use?", options: ["A. Mobile application protection policy.", "B. Microsoft Azure AD Identity Protection.", "C. Microsoft Azure AD Privilege Identity Protection.", "D. Microsoft Azure AD Conditional Access."], correct: "C" },

                { id: 27, text: "You have been tasked with deploying Microsoft 365 for your company in a hybrid configuration. You want to make sure that a smart card can be used by staff for authentication purposes. Solution: You configure the use of pass-through authentication and single sign-on as the hybrid identity solution. Does the solution meet the goal?", options: ["A. Yes", "B. No"], correct: "B" },
                { id: 28, text: "You have been tasked with deploying Microsoft 365 for your company in a hybrid configuration. You want to make sure that a smart card can be used by staff for authentication purposes. Solution: You configure the use of Active Directory Federation Services (AD FS) as the hybrid identity solution. Does the solution meet the goal?", options: ["A. Yes", "B. No"], correct: "A" },
                { id: 29, text: "To retrieve data for employees who request personal data under General Data Protection Regulation (GDPR) guidelines, you have to create a GDPR assessment. Select `No adjustment required` if the underlined segment is accurate. If the underlined segment is inaccurate, select the accurate option. What should you do?", options: ["A. No adjustment required", "B. Mobile application protection policy", "C. Device configuration policy", "D. Data subject request case"], correct: "D" },
                { id: 30, text: "You are a Microsoft 365 administrator for a company whose employees are allowed to access corporate information located in the cloud via their personal devices. You have been tasked with making sure that employees are prohibited from copying this information to their personal OneDrive folders. You should make use of Intune App Protection. Select `No adjustment required` if the underlined segment is accurate. If the underlined segment is inaccurate, select the accurate option.", options: ["A. No adjustment required", "B. Information Rights Management", "C. Microsoft Azure AD Privilege Identity Protection", "D. Microsoft Azure AD Identity Protection"], correct: "A" },
                { id: 32, text: "Your company has a Microsoft Office 365 subscription. You have been tasked with removing customer information in compliance with General Data Protection Regulation (GDPR), after the customer generated a data subject request (DSR). You want to make sure that legal holds are placed on relevant information if the opportunity arises. You want to start searching for the client's information by using Content Search eDiscovery. Which of the following applications can be searched with this method? (Choose two.)", options: ["A. Microsoft PowerApps", "B. Microsoft Outlook.", "C. Microsoft Access", "D. Microsoft SharePoint Online."], correct: "BD" },
                { id: 33, text: "You have been tasked with configuring a data governance strategy that allows for data classification. It should also allow for these classifications to be enforced. Which of the following should form part of your strategy? (Choose two.)", options: ["A. Apply Microsoft SharePoint permissions.", "B. Publish labels.", "C. Configure Microsoft Outlook Mail Tips.", "D. Apply supervision policies.", "E. Apply retention policies.", "F. Apply preservation policies."], correct: "BE" },
                { id: 34, text: "Your company has a Microsoft Office 365 subscription. As an administrator for this subscription, you are required to configure the use of a cloud security feature that allows for emails and documents to be classified and labeled. Which of the following is the feature you should use?", options: ["A. Microsoft Azure Information Protection.", "B. Microsoft Azure AD Identity Protection.", "C. Microsoft Azure AD Privilege Identity Protection.", "D. Intune App Protection."], correct: "A" },
                { id: 35, text: "After acquiring a Microsoft 365 E5 subscription, you are tasked with applying security features. You are currently configuring a security feature that allows you to control how a Microsoft support engineer accesses information during a help session. Which of the following is the feature you are configuring?", options: ["A. Customer Lockbox.", "B. Data Governance.", "C. Data Loss Prevention.", "D. Microsoft Office 365 Advanced Threat Protection."], correct: "A" },
                { id: 36, text: "After acquiring a Microsoft 365 E5 subscription, you are tasked with applying security features. You are currently configuring a security feature that allows you to protect against unidentified malware, viruses, and malicious URLs. Which of the following is the feature you are configuring?", options: ["A. Microsoft Azure AD Identity Protection.", "B. Data Governance.", "C. Microsoft Azure AD Conditional Access.", "D. Microsoft Office 365 Advanced Threat Protection."], correct: "D" },
                { id: 39, text: "You need to consider the underlined segment to establish whether it is accurate. You have been tasked with acquiring Microsoft 365 Enterprise licenses for your organization. You should contact a Cloud Solution Provider (CSP) or subscribe to a Microsoft Enterprise Agreement (EA). Select `No adjustment required` if the underlined segment is accurate. If the underlined segment is inaccurate, select the accurate option. Which two options can you use? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.", options: ["A. No adjustment required", "B. Contact a Cloud Solution Provider (CSP) or use a company credit card via the Microsoft website", "C. Subscribe to a Microsoft Enterprise Agreement (EA) or visit a Microsoft retail store", "D. Use a company credit card via the Microsoft website or visit a Microsoft retail store subscription from"], correct: "A" },
                { id: 40, text: "Your company has a Microsoft 365 subscription. After a Microsoft 365 outage, the Service Health Dashboard indicates no issues with the service. You check the Service Health Dashboard and observe that the service is healthy. You then access the Post-Incident Review (PIR). Which of the following is the maximum time, after an incident has been resolved, that you have to wait for a preliminary Post-Incident Review (PIR) to be delivered via your Service Health Dashboard?", options: ["A. 12 hours.", "B. 24 hours.", "C. 48 hours.", "D. 5 business days."], correct: "C" },
                { id: 41, text: "A retail company is planning to upgrade their Windows 7 point-of-sale terminals to Windows 10. You have been informed that the terminals should only be upgraded again after a minimum of five years. Your solution has to allow for the scheduling of upgrades and updates to be executed consistently for all devices, while also keeping costs to a minimum. Which of the following is the version of Windows you should upgrade to?", options: ["A. Windows 10 Home", "B. Windows 10 Pro", "C. Windows 10 Enterprise", "D. Windows 10 Enterprise LTSC"], correct: "D" },
                { id: 42, text: "A retail company is planning to upgrade their Windows 7 point-of-sale terminals to Windows 10. You have been informed that the terminals should only be upgraded again after a minimum of five years. Your solution has to allow for the scheduling of upgrades and updates to be executed consistently for all devices, while also keeping costs to a minimum. Which of the following is the servicing tool that you should use?", options: ["A. Windows Autopilot", "B. Windows Server Update Services", "C. Microsoft Intune", "D. Azure AD Connect"], correct: "B" },
                { id: 43, text: "You need to consider the underlined segment to establish whether it is accurate. Your company has a Microsoft Office 365 subscription. As an administrator for this subscription, you want to check what the repercussions are if the availability terms of the Microsoft Office 365 services are not satisfied. You analyze the Service Level Agreement. Select `No adjustment required` if the underlined segment is accurate. If the underlined segment is inaccurate, select the accurate option.", options: ["A. No adjustment required", "B. Analyze the Microsoft Cloud Agreement", "C. Access Data Governance", "D. Analyze the Microsoft Enterprise Agreement"], correct: "A" },
                { id: 44, text: "You have been tasked with deploying Microsoft Office to company using a subscription-based licensing model. The version of Office you deploy should allow for Office application settings to be enforced via group policy. Solution: You deploy Office Professional Plus 2016. Does the solution meet the goal?", options: ["A. Yes", "B. No"], correct: "B" },
                { id: 45, text: "You have been tasked with deploying Microsoft Office to company using a subscription-based licensing model. The version of Office you deploy should allow for Office application settings to be enforced via group policy. Solution: You deploy Office Home and Business 2016. Does the solution meet the goal?", options: ["A. Yes", "B. No"], correct: "B" },
                { id: 46, text: "You have been tasked with deploying Microsoft Office to company using a subscription-based licensing model. The version of Office you deploy should allow for Office application settings to be enforced via group policy. Solution: You deploy Office 365 ProPlus. Does the solution meet the goal?", options: ["A. Yes", "B. No"], correct: "A" },
                { id: 47, text: "Your company has a Microsoft Office 365 subscription. As an administrator for this subscription, you have been tasked with assigning Microsoft 365 licenses to users in a department where audio-conferencing is not required. The department does, however, require Office desktop products to complete tasks. Which of the following is the license that would help you achieve this?", options: ["A. Office 365 ProPlus", "B. Microsoft 365 E1", "C. Office 365 E3", "D. Office 365 E5"], correct: "A" },
                { id: 48, text: "Your company has a Microsoft Office 365 subscription. As an administrator for this subscription, you have been tasked with assigning Microsoft 365 licenses for a department where users need to collaborate with other users and also check their job schedules on a weekly basis. The department does not, however, require Office desktop products to complete tasks. Which of the following is the license that would help you achieve this?", options: ["A. Office 365 F1", "B. Microsoft 365 E1", "C. Office 365 E3", "D. Office 365 E5"], correct: "A" },
                { id: 50, text: "You need to identify which Microsoft platforms provide hybrid capabilities for migrating from an on-premises deployment. Which two platforms provide hybrid capabilities for migration? Each correct answer provides a complete solution. NOTE: Each correct selection is worth one point.", options: ["A. Microsoft Skype for Business", "B. Microsoft Yammer", "C. Microsoft Exchange", "D. Microsoft Teams"], correct: "AC" },

                { id: 56, text: "This question requires that you evaluate the underlined text to determine if it is correct. Microsoft 365 is a Platform as a Service (PaaS). Review the underlined text. If it makes the statement correct, select `No change is needed.` If the statement is incorrect, select the answer choice that makes the statement correct.", options: ["A. Infrastructure as a service (IaaS)", "B. Windows as a service (WaaS)", "C. Software as a service (SaaS)", "D. No change is needed"], correct: "C", },
                { id: 57, text: "You need to deploy an application to Microsoft Infrastructure as a Service (IaaS). Which three features are part of IaaS? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.", options: ["A. Business analytics", "B. Real-time monitoring", "C. Operating system", "D. Servers and storage", "E. Firewall and network security"], correct: "BDE", }

        </script>
    </div>

    <div class="navigation">
        <button onclick="prevQuestion()" id="prev">Previous</button>
        <button onclick="nextQuestion()" id="next">Next</button>
    </div>

    <script>
        let currentQuestionIndex = 0;

        function showQuestion(index) {
            const question = questions[index];
            document.getElementById("questions").innerHTML = `
                <div class="question-container active">
                    <h1>Question ${question.id}</h1>
                    <p>${question.text}</p>
                    <form id="form-q${question.id}">
                        ${question.options.map((opt, i) => `
                            <input type="${Array.isArray(question.correct) ? 'checkbox' : 'radio'}" 
                                   name="q${question.id}" 
                                   value="${opt}"> ${opt}<br>
                        `).join('')}
                    </form>
                    <button id="check-q${question.id}">Check Answer</button>
                    <p id="result-q${question.id}"></p>
                </div>
            `;

            // Ensure the check answer button is bound to its function after being created
            document.getElementById(`check-q${question.id}`).addEventListener("click", function () {
                checkAnswer(question.id, question.correct);
            });
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                showQuestion(currentQuestionIndex);
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                showQuestion(currentQuestionIndex);
            }
        }

        function checkAnswer(questionId, correctAnswers) {
            const selectedOptions = Array.from(document.querySelectorAll(`input[name="q${questionId}"]:checked`))
                .map(opt => opt.value);
            const resultElement = document.getElementById(`result-q${questionId}`);

            if (!resultElement) return;

            if (selectedOptions.length === 0) {
                resultElement.textContent = "Please select at least one answer.";
                resultElement.style.color = "orange";
                return;
            }

            const isCorrect = Array.isArray(correctAnswers)
                ? correctAnswers.every(ans => selectedOptions.includes(ans)) && selectedOptions.length === correctAnswers.length
                : selectedOptions.length === 1 && selectedOptions[0] === correctAnswers;

            resultElement.textContent = isCorrect ? "Correct!" : `Incorrect. The correct answer is ${Array.isArray(correctAnswers) ? correctAnswers.join(", ") : correctAnswers}.`;
            resultElement.style.color = isCorrect ? "green" : "red";
        }

        // Show the first question on page load
        showQuestion(currentQuestionIndex);
    </script>
</body>

</html>
