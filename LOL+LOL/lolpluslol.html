<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Archery_Target_icon.svg/1024px-Archery_Target_icon.svg.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Archery Score Trainer</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        .card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        .input {
            width: calc(100% - 20px);
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            box-sizing: border-box;
        }
        .button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:disabled {
            background-color: #555;
        }
        .score {
            margin-top: 15px;
        }
        .dark-mode {
            background-color: #1e1e1e;
            color: #d4d4d4;
        }
        .dark-mode .card {
            background: #2d2d2d;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.5);
        }
        .dark-mode .input {
            background-color: #3a3a3a;
            color: #ffffff;
            border: 1px solid #555;
        }
    </style>
</head>
<body class="dark-mode">
    <div id="root"></div>
    <button onclick="toggleDarkMode()" style="position: fixed; top: 10px; right: 10px; padding: 5px 10px;">🌙</button>
    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        function generateArcheryNumber() {
            const weightedNumbers = [7, 7, 7, 7, 8, 8, 8, 8, 9, 9, 9, 9, 10, 10, 10, "X", "X", "M", "M"];
            return weightedNumbers[Math.floor(Math.random() * weightedNumbers.length)];
        }

        function generateLargeNumber() {
            const weightedNumbers = Array(20).fill().map(() => Math.floor(Math.random() * 31) + 30)
                .concat(Array(10).fill().map(() => Math.floor(Math.random() * 31)));
            let num1 = weightedNumbers[Math.floor(Math.random() * weightedNumbers.length)];
            let num2;
            do {
                num2 = weightedNumbers[Math.floor(Math.random() * weightedNumbers.length)];
            } while (num1 === num2);
            return [num1, num2];
        }

        function getNumericValue(value) {
            if (value === "X") return 10;
            if (value === "M") return 0;
            return value;
        }

        let correct = 0, incorrect = 0;
        let isArcheryQuestion = Math.random() < 0.7;
        let num1, num2, num3, questionType;

        if (isArcheryQuestion) {
            num1 = generateArcheryNumber();
            num2 = generateArcheryNumber();
            num3 = generateArcheryNumber();
            questionType = "archery";
        } else {
            [num1, num2] = generateLargeNumber();
            questionType = "largeNumbers";
        }

        function render() {
            let questionText = questionType === "archery" ? `${num1} + ${num2} + ${num3} = ?` : `${num1} + ${num2} = ?`;
            document.getElementById('root').innerHTML = `
                <div class="card">
                    <h1>Archery Score Trainer</h1>
                    <p>Solve: ${questionText}</p>
                    <input type="number" id="answer" class="input" inputmode="numeric" pattern="[0-9]*" />
                    <button class="button" id="checkButton" onclick="checkAnswer()" disabled>Check Answer</button>
                    <p id="result"></p>
                    <p class="score">Score: ✅ <span id="correct">${correct}</span> | ❌ <span id="incorrect">${incorrect}</span></p>
                </div>
            `;
        }

        function checkAnswer() {
            document.getElementById('checkButton').disabled = true;
            const userAnswer = parseInt(document.getElementById('answer').value);
            let correctAnswer = questionType === "archery" ? getNumericValue(num1) + getNumericValue(num2) + getNumericValue(num3) : num1 + num2;
            
            if (userAnswer === correctAnswer) {
                correct++;
            } else {
                incorrect++;
            }
            document.getElementById('result').innerHTML = `Correct Answer: ${correctAnswer}`;
            
            setTimeout(() => {
                document.getElementById('checkButton').disabled = false;
                isArcheryQuestion = Math.random() < 0.7;
                if (isArcheryQuestion) {
                    num1 = generateArcheryNumber();
                    num2 = generateArcheryNumber();
                    num3 = generateArcheryNumber();
                    questionType = "archery";
                } else {
                    [num1, num2] = generateLargeNumber();
                    questionType = "largeNumbers";
                }
                render();
            }, 3000);
        }

        render();
    </script>
</body>
</html>
