<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Archery Trainer</title>
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Archery_Target_icon.svg/1024px-Archery_Target_icon.svg.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }
    .dark-mode { background-color: #1e1e1e; color: #d4d4d4; }
    .light-mode { background-color: #ffffff; color: #000000; }
    .tabs {
      margin-bottom: 20px;
    }
    .tabs button {
      padding: 10px;
      margin: 0 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .card {
      background: #2d2d2d;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 300px;
      transition: background-color 0.3s ease;
      display: none;
    }
    .card.active { display: block; }
    .light-mode .card { background: #f9f9f9; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); }
    .card.work-phase { background-color: #2b3f5c; }
    .card.rest-phase { background-color: #3a2b5c; }
    .light-mode .card.work-phase { background-color: #d0e7ff; }
    .light-mode .card.rest-phase { background-color: #ecd9ff; }
    input, .input {
      width: calc(100% - 20px);
      padding: 10px;
      margin-top: 10px;
      background-color: #3a3a3a;
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 5px;
      text-align: center;
      box-sizing: border-box;
      font-size: 16px;
    }
    .light-mode input, .light-mode .input {
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #ccc;
    }
    button, .button {
      padding: 10px;
      margin-top: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
    }
    h1 { margin-bottom: 10px; color: #BB86FC; }
    #phase, #repCount, #countdown { margin-top: 10px; font-weight: bold; }
    .score { margin-top: 15px; }
    .theme-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 5px 10px;
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .dark-mode .theme-toggle {
      background-color: #2d2d2d;
      color: #d4d4d4;
      border: 1px solid #444;
    }
  </style>
</head>
<body class="dark-mode">
  <div class="tabs">
    <button onclick="showTab('timer')">⏱ Interval Timer</button>
    <button onclick="showTab('score')">🎯 Score Trainer</button>
  </div>
  <button onclick="toggleTheme()" class="theme-toggle">🌙</button>

  <div class="card active" id="timer">
    <h1>Interval Timer</h1>
    <label for="reps">Repetitions:</label>
    <input type="number" id="reps" value="25" min="1" />
    <label for="work">Work Duration (seconds):</label>
    <input type="number" id="work" value="30" min="1" />
    <label for="rest">Rest Duration (seconds):</label>
    <input type="number" id="rest" value="60" min="1" />
    <button onclick="startTimer()" id="startButton">Start</button>
    <div id="phase"></div>
    <div id="repCount"></div>
    <div id="countdown"></div>
  </div>

  <div class="card" id="score">
    <h1>Archery Score Trainer</h1>
    <p id="question"></p>
    <input type="number" id="answer" class="input" inputmode="numeric" pattern="[0-9]*" />
    <button class="button" id="checkButton" onclick="checkAnswer()">Check Answer</button>
    <p id="result"></p>
    <p class="score">Score: ✅ <span id="correct">0</span> | ❌ <span id="incorrect">0</span></p>
  </div>

  <script>
    function showTab(tab) {
      document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
    }

    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      document.body.classList.toggle("light-mode");
    }

    let correct = 0, incorrect = 0;
    let num1, num2, num3, questionType;

    function generateArcheryNumber() {
      const weighted = [];
      for (let i = 6; i <= 10; i++) weighted.push(i, i, i, i);
      weighted.push("X", "M");
      return weighted[Math.floor(Math.random() * weighted.length)];
    }

    function generateLargeNumber() {
      let a = Math.floor(Math.random() * 61), b;
      do { b = Math.floor(Math.random() * 61); } while (a === b);
      return [a, b];
    }

    function getNumericValue(val) {
      if (val === "X") return 10;
      if (val === "M") return 0;
      return val;
    }

    function renderQuestion() {
      let isArchery = Math.random() < 0.7;
      if (isArchery) {
        num1 = generateArcheryNumber();
        num2 = generateArcheryNumber();
        num3 = generateArcheryNumber();
        questionType = "archery";
        document.getElementById('question').textContent = `${num1} + ${num2} + ${num3} = ?`;
      } else {
        [num1, num2] = generateLargeNumber();
        questionType = "large";
        document.getElementById('question').textContent = `${num1} + ${num2} = ?`;
      }
    }

    function checkAnswer() {
      document.getElementById('checkButton').disabled = true;
      const user = parseInt(document.getElementById('answer').value);
      const answer = questionType === "archery"
        ? getNumericValue(num1) + getNumericValue(num2) + getNumericValue(num3)
        : num1 + num2;
      if (user === answer) correct++;
      else incorrect++;
      document.getElementById('result').textContent = `Correct Answer: ${answer}`;
      document.getElementById('correct').textContent = correct;
      document.getElementById('incorrect').textContent = incorrect;
      setTimeout(() => {
        document.getElementById('checkButton').disabled = false;
        document.getElementById('answer').value = '';
        document.getElementById('result').textContent = '';
        renderQuestion();
      }, 3000);
    }
      // Timer app logic
    let rep = 1;
    let isRunning = false;
    let countdownInterval;
    let currentPhase = "";
    const card = document.getElementById("timer");
    const startButton = document.getElementById("startButton");
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    async function ensureAudioReady() {
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }
    }

    async function beep(count = 1, freq = 500, duration = 500, spacing = 100) {
      await ensureAudioReady();
      for (let i = 0; i < count; i++) {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(freq, audioContext.currentTime + i * ((duration + spacing) / 1000));
        const startTime = audioContext.currentTime + i * ((duration + spacing) / 1000);
        const endTime = startTime + duration / 1000;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.1, startTime + 0.05);
        gain.gain.linearRampToValueAtTime(0, endTime);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(startTime);
        oscillator.stop(endTime);
      }
    }

    function up() {
      beep(1, 600, 800, 300);
      beep(1, 800, 800, 300);
      beep(1, 1000, 800, 300);
    }

    function down() {
      beep(1, 1000, 800, 300);
      beep(1, 800, 800, 300);
      beep(1, 600, 800, 300);
    }

    function setCardPhase(phase) {
      card.classList.remove("work-phase", "rest-phase");
      if (phase === "work") card.classList.add("work-phase");
      if (phase === "rest") card.classList.add("rest-phase");
      currentPhase = phase;
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      startButton.disabled = true;
      const totalReps = parseInt(document.getElementById("reps").value);
      const work = parseInt(document.getElementById("work").value);
      const rest = parseInt(document.getElementById("rest").value);
      rep = 1;
      up();
      setCardPhase("work");
      setTimeout(() => runWork(totalReps, work, rest), 3000);
    }

    function startCountdown(seconds) {
      clearInterval(countdownInterval);
      const countdownElement = document.getElementById("countdown");
      countdownElement.textContent = seconds;
      countdownInterval = setInterval(() => {
        seconds--;
        countdownElement.textContent = seconds;
        if (currentPhase === "rest" && seconds <= 3 && seconds > 0) {
          document.getElementById("phase").textContent = "GET READY TO DRAW!";
        }
        if (seconds <= 0) clearInterval(countdownInterval);
      }, 1000);
    }

    function runWork(totalReps, work, rest) {
      if (rep > totalReps) {
        document.getElementById("phase").textContent = "Workout Complete!";
        document.getElementById("repCount").textContent = "";
        document.getElementById("countdown").textContent = "";
        card.classList.remove("work-phase", "rest-phase");
        down();
        isRunning = false;
        startButton.disabled = false;
        return;
      }
      setCardPhase("work");
      document.getElementById("phase").textContent = "DRAW!";
      document.getElementById("repCount").textContent = `Rep ${rep} of ${totalReps}`;
      startCountdown(work);
      beep(1, 500, 500, 100);
      setTimeout(() => runRest(totalReps, work, rest), work * 1000);
    }

    function runRest(totalReps, work, rest) {
      setCardPhase("rest");
      document.getElementById("phase").textContent = "REST!";
      document.getElementById("repCount").textContent = `Rep ${rep} of ${totalReps}`;
      startCountdown(rest);
      beep(2, 500, 300, 100);
      rep++;
      setTimeout(() => runWork(totalReps, work, rest), rest * 1000);
    }
        

    renderQuestion();
  </script>
</body>
</html>
